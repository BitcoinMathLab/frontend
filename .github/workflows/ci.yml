name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build production application
        run: npm run build

      - name: Run unit tests
        run: npm run test:ci

      - name: Run deployment configuration tests
        run: npm run test:config

  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out product backend
        uses: actions/checkout@v4
        with:
          repository: BitcoinMathLab/backend
          ref: main
          path: .integration/backend

      - name: Check out Bitclone engine
        uses: actions/checkout@v4
        with:
          repository: BitcoinMathLab/bitclone
          ref: main
          path: .integration/bitclone

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: npm ci

      - name: Install API and engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.integration/bitclone
          python -m pip install -e './.integration/backend[dev]'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
        env:
          BML_LIVE_API: '1'
          BML_BACKEND_COMMAND: python -m uvicorn bml_backend.app:app --host 127.0.0.1 --port 8000
          BML_BACKEND_CWD: .integration/backend
