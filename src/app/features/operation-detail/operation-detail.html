<div class="backdrop" role="presentation" (click)="close.emit()">
  <section
    #dialog
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="operation-detail-title"
    aria-describedby="operation-detail-summary operation-detail-requirement"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown)="handleKeydown($event)"
  >
    <button type="button" aria-label="Close operation detail" (click)="close.emit()">×</button>
    <span>{{ detail().kind }}</span>
    <h2 id="operation-detail-title">
      {{ detail().kind === 'DATA' ? 'DATA (' + detail().name + ')' : detail().name }}
    </h2>
    <dl class="opcode-facts">
      <div>
        <dt>Hex</dt>
        <dd>
          <code>{{ detail().hex }}</code>
        </dd>
      </div>
    </dl>
    <div class="purpose">
      <strong>Purpose</strong>
      <p id="operation-detail-summary">{{ detail().summary }}</p>
    </div>
    <div class="requirement">
      <strong>Stack effect</strong>
      <p id="operation-detail-requirement">{{ detail().requirement }}</p>
    </div>
  </section>
</div>
