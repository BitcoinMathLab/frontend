<section class="stack-view" [attr.aria-label]="label()">
  <header>
    <strong>{{ label() }}</strong>
    <span>{{ snapshot().depth }} {{ snapshot().depth === 1 ? 'item' : 'items' }}</span>
  </header>
  <div class="stack-view__items">
    @for (item of visibleItems(); track item.key) {
      <button
        type="button"
        class="stack-item"
        [class]="item.kind"
        (click)="inspectItem.emit({ position: item.position, name: item.label, hex: item.value })"
        [attr.aria-label]="'DATA (' + item.label + '), ' + item.position + ' of stack'"
      >
        <code>DATA ({{ item.label }})</code>
        <code [title]="item.value">{{ preview(item.value) }}</code>
      </button>
    } @empty {
      <p>Empty stack</p>
    }
  </div>
  @if (hiddenItemCount() > 0) {
    <button type="button" class="stack-overflow" (click)="openAllItems()">
      Inspect {{ hiddenItemCount() }} more {{ hiddenItemCount() === 1 ? 'item' : 'items' }}
    </button>
  }
</section>

@if (expanded() && hasOverflow()) {
  <div class="stack-backdrop" role="presentation" (click)="closeAllItems()">
    <section
      class="stack-detail"
      role="dialog"
      aria-modal="true"
      aria-label="All stack items"
      (click)="$event.stopPropagation()"
    >
      <header>
        <h2>All stack items</h2>
        <button type="button" aria-label="Close all stack items" (click)="closeAllItems()">
          ×
        </button>
      </header>
      <div>
        @for (item of items(); track item.key) {
          <button
            type="button"
            (click)="
              inspectItem.emit({ position: item.position, name: item.label, hex: item.value })
            "
          >
            <code>DATA ({{ item.label }})</code><code>{{ item.value }}</code>
          </button>
        }
      </div>
    </section>
  </div>
}
