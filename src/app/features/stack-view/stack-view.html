<section
  class="stack-view"
  [class.stack-view--headerless]="!showHeader()"
  [attr.aria-label]="label()"
>
  @if (showHeader()) {
    <header>
      <strong>{{ label() }}</strong>
      <span>{{ snapshot().depth }} {{ snapshot().depth === 1 ? 'item' : 'items' }}</span>
    </header>
  }
  <div class="stack-view__items">
    @for (item of items(); track item.key) {
      <article class="stack-item" [class]="item.kind">
        <span class="stack-item__kind">{{ item.kind }}</span>
        <strong>{{ item.position }} · {{ item.label }}</strong>
        <code [title]="item.value">{{ item.value }}</code>
      </article>
    } @empty {
      <p>empty</p>
    }
  </div>
</section>
