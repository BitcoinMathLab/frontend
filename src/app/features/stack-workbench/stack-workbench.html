<section class="stack-workbench" aria-label="Stack state" aria-live="polite">
  <header class="stack-workbench__header">
    <h2>Stack state</h2>
    <span>after {{ step().opcode.name }}</span>
  </header>

  <div class="stack-columns">
    <app-stack-view
      label="Main stack"
      [snapshot]="step().stacks.after.main"
      [stepIndex]="step().index"
    />
    <app-stack-view
      label="Alt stack"
      [snapshot]="step().stacks.after.alt"
      [stepIndex]="step().index"
    />
  </div>

  <div class="movement-grid" aria-label="Stack movement">
    <section>
      <h4>Consumed</h4>
      @for (item of movement().consumed; track $index) {
        <span class="movement-pill movement-pill--out" [title]="item.value">
          − {{ item.label }}
        </span>
      } @empty {
        <span class="movement-empty">none</span>
      }
    </section>
    <section>
      <h4>Produced</h4>
      @for (item of movement().produced; track $index) {
        <span class="movement-pill movement-pill--in" [title]="item.value">
          + {{ item.label }}
        </span>
      } @empty {
        <span class="movement-empty">none</span>
      }
    </section>
  </div>
</section>
