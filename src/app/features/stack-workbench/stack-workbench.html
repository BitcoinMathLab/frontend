<section class="stack-workbench" aria-label="Stack state" aria-live="polite">
  <header class="stack-workbench__header">
    <h2>Stack state</h2>
    <span>{{ stackStateLabel() }}</span>
  </header>

  <div class="stack-columns">
    <app-stack-view
      label="Main stack"
      [snapshot]="mainStack()"
      [stepIndex]="step()?.index ?? -1"
      (inspectItem)="inspectItem.emit($event)"
    />
  </div>
</section>
