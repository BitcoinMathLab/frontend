<section class="visualizer-hero">
  <h1>Stack visualizer</h1>
  <p class="hero-intro">Follow a P2PKH spend as each instruction changes the stack.</p>
</section>

<section class="lab" aria-label="P2PKH spend verification">
  @if (loading()) {
    <div class="state-card" role="status">
      <span class="state-card__pulse" aria-hidden="true"></span> Preparing the walkthrough…
    </div>
  } @else if (error()) {
    <div class="state-card state-card--error" role="alert">
      <div>
        <strong>The walkthrough could not load.</strong>
        <p>Start the local backend, then try again.</p>
      </div>
      <button type="button" (click)="loadTrace()">Try again</button>
    </div>
  } @else if (response(); as result) {
    <app-trace-player [trace]="result.trace" [scripts]="result.scripts" />
  }
</section>
